<html lang="en">
<head>

<!-- ММОСО’Н · страница «Gallery». Один самодостаточный файл: разметка, стили, скрипт и иллюстрации внутри.  Страница сайта ММОСО’Н: самодостаточный HTML-файл. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Raleway:wght@300;400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238f7ed6'/%3E%3Ccircle cx='32' cy='24' r='9' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='32' cy='44' r='9' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<style>
/* ============================================================
   ММОСО’Н — визуальный язык (КРЯК-дизайн)
   Лавандовый фон, белые «стеклянные» секции-карточки,
   Montserrat + Raleway, градиентные подчёркивания.
   ============================================================ */

:root {
  --primary: #8f7ed6;
  --primary-dark: #7260c2;
  --primary-deep: #5a49a8;
  --primary-light: #a897e8;
  --secondary: #ff6b6b;
  --accent: #4ecdc4;
  --gold: #ffd166;
  --light: #ffffff;
  --text: #333333;
  --text-soft: #5b5570;
  --line: rgba(143, 126, 214, 0.22);
  --shadow: 0 8px 20px rgba(43, 30, 90, 0.12);
  --shadow-strong: 0 12px 25px rgba(43, 30, 90, 0.16);
  --shadow-hover: 0 18px 38px rgba(43, 30, 90, 0.22);
  --radius: 20px;
  --radius-sm: 15px;
  --transition: all 0.3s ease;
  --transition-slow: all 0.6s ease;
  --maxw: 1200px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Raleway', 'Segoe UI', system-ui, sans-serif;
  background: var(--primary);
  color: #fff;
  line-height: 1.6;
  overflow-x: hidden;
  padding: 20px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5 {
  font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
  font-weight: 700;
  line-height: 1.2;
}

img { max-width: 100%; display: block; }
a { color: inherit; }
code {
  font-family: 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.88em;
  background: rgba(143, 126, 214, 0.12);
  border: 1px solid var(--line);
  padding: 1px 6px;
  border-radius: 6px;
  color: var(--primary-deep);
  white-space: nowrap;
}

.container {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 48px;
  width: 100%;
}

.page {
  max-width: var(--maxw);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 34px;
}

/* ================= NAV ================= */
.nav-wrap {
  position: sticky;
  top: 12px;
  z-index: 60;
  max-width: var(--maxw);
  margin: 0 auto 14px;
}

.nav {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 10px 14px 10px 20px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.32);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 10px 26px rgba(43, 30, 90, 0.18);
}

.nav-brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-decoration: none;
  color: #fff;
  font-size: 1rem;
  white-space: nowrap;
}
.nav-mark { width: 26px; height: 26px; color: #fff; opacity: 0.9; }

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
  list-style: none;
  margin-left: auto;
  flex-wrap: wrap;
}
.nav-links a {
  display: inline-block;
  text-decoration: none;
  font-size: 0.86rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.92);
  padding: 8px 13px;
  border-radius: 999px;
  transition: var(--transition);
}
.nav-links a:hover,
.nav-links a.active {
  background: rgba(255, 255, 255, 0.9);
  color: var(--primary-deep);
}

.nav-toggle {
  display: none;
  margin-left: auto;
  width: 42px; height: 42px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.18);
  cursor: pointer;
  padding: 0;
  place-items: center;
  gap: 4px;
}
.nav-toggle span {
  display: block;
  width: 18px; height: 2px;
  background: #fff;
  border-radius: 2px;
  margin: 3px auto;
  transition: var(--transition);
}
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(5px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-5px) rotate(-45deg); }

/* ================= HERO ================= */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid rgba(255, 255, 255, 0.28);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.06) 45%, rgba(78, 205, 196, 0.10) 100%),
    rgba(131, 125, 189, 0.55);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow-strong);
  padding: 78px 0 66px;
  text-align: center;
}

.hero-field { position: absolute; inset: 0; pointer-events: none; }

.stars {
  position: absolute; inset: -50%;
  background-image:
    radial-gradient(1.6px 1.6px at 20% 30%, rgba(255,255,255,.85), transparent 60%),
    radial-gradient(1.4px 1.4px at 70% 20%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1.8px 1.8px at 45% 70%, rgba(255,255,255,.8), transparent 60%),
    radial-gradient(1.2px 1.2px at 85% 60%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1.4px 1.4px at 12% 82%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1.2px 1.2px at 60% 45%, rgba(255,255,255,.55), transparent 60%);
  background-size: 420px 420px, 380px 380px, 500px 500px, 450px 450px, 340px 340px, 300px 300px;
  opacity: 0.5;
  animation: drift 90s linear infinite;
}
.stars-b { opacity: 0.25; animation-duration: 140s; animation-direction: reverse; background-size: 260px 260px; }

.orbit {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.16);
}
.orbit-1 { width: 780px; height: 780px; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.orbit-2 { width: 1080px; height: 1080px; left: 50%; top: 50%; transform: translate(-50%, -50%); border-style: dashed; opacity: .5; }

.glow {
  position: absolute;
  width: 760px; height: 420px;
  left: 50%; top: -160px;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(255, 107, 107, 0.28), rgba(143, 126, 214, 0) 75%);
  filter: blur(10px);
}

.hero-content { position: relative; z-index: 2; }

.eyebrow {
  display: inline-block;
  font-size: 0.78rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.88);
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.26);
  padding: 8px 18px;
  border-radius: 999px;
  margin-bottom: 24px;
}

.emblem {
  width: 168px;
  margin: 0 auto 22px;
  filter: drop-shadow(0 10px 26px rgba(30, 18, 70, 0.35));
  animation: floaty 9s ease-in-out infinite;
}
.emblem svg { width: 100%; height: auto; }

.hero-title {
  font-size: clamp(2.6rem, 6vw, 4.1rem);
  letter-spacing: 0.06em;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 4px 24px rgba(40, 24, 90, 0.35);
}

.hero-subtitle {
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: clamp(1.05rem, 2.2vw, 1.5rem);
  margin: 12px auto 18px;
  max-width: 780px;
  color: rgba(255, 255, 255, 0.96);
}

.hero-lead {
  font-size: 1.05rem;
  font-weight: 400;
  max-width: 660px;
  margin: 0 auto 30px;
  color: rgba(255, 255, 255, 0.9);
}

.hero-actions {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 46px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 30px;
  border-radius: 30px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
  transition: var(--transition);
}
.btn-primary {
  background: var(--primary-dark);
  color: #fff;
  box-shadow: 0 10px 24px rgba(40, 24, 90, 0.28);
}
.btn-primary:hover { background: var(--primary-deep); transform: translateY(-3px); box-shadow: 0 16px 32px rgba(40, 24, 90, 0.34); }
.btn-ghost {
  background: rgba(255, 255, 255, 0.14);
  border-color: rgba(255, 255, 255, 0.45);
  color: #fff;
}
.btn-ghost:hover { background: rgba(255, 255, 255, 0.26); transform: translateY(-3px); }

.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.24);
}
.hero-stat { text-align: center; padding: 6px 10px; }
.hero-stat dt {
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255, 255, 255, 0.72);
  margin-bottom: 6px;
}
.hero-stat dd {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: clamp(1.1rem, 2.2vw, 1.5rem);
  color: #fff;
}
.hero-stat dd span {
  font-size: 0.62em;
  font-weight: 600;
  color: var(--accent);
  margin-left: 2px;
}

/* ================= SECTION CARDS ================= */
.card-section {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.96);
  box-shadow: var(--shadow-strong);
  padding: 74px 0;
  color: var(--text);
  scroll-margin-top: 96px;
}
.card-section::after {
  content: '';
  position: absolute;
  inset: auto -10% -40% auto;
  width: 420px; height: 420px;
  background: radial-gradient(closest-side, rgba(143, 126, 214, 0.10), transparent 70%);
  pointer-events: none;
}

.section-title { text-align: center; margin-bottom: 50px; position: relative; }
.section-title h2 {
  font-size: clamp(1.6rem, 3vw, 2.4rem);
  color: var(--primary-dark);
  display: inline-block;
  position: relative;
  padding-bottom: 18px;
}
.section-title h2::after {
  content: '';
  position: absolute;
  left: 10%; bottom: 0;
  width: 80%; height: 3px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
}
.section-kicker {
  margin-top: 14px;
  font-size: 0.95rem;
  color: var(--text-soft);
}

/* ================= ABOUT ================= */
.about-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
  gap: 40px;
  align-items: start;
}
.about-text p { color: var(--text); font-size: 1.02rem; line-height: 1.75; margin-bottom: 16px; }
.about-text strong { color: var(--primary-deep); }

.check-list { list-style: none; margin-top: 26px; display: grid; gap: 12px; }
.check-list li {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-size: 0.96rem;
  color: var(--text);
  background: linear-gradient(to right, rgba(143, 126, 214, 0.09), rgba(143, 126, 214, 0.02));
  border-left: 4px solid var(--accent);
  border-radius: 0 12px 12px 0;
  padding: 12px 16px;
}
.check-ico {
  flex: 0 0 auto;
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 700;
  margin-top: 1px;
}

.about-side { display: grid; gap: 16px; }
.mini-card {
  background: #fff;
  border-radius: var(--radius-sm);
  border-left: 4px solid var(--primary);
  box-shadow: var(--shadow);
  padding: 22px 24px;
  transition: var(--transition);
}
.mini-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.mini-card h3 { font-size: 1.02rem; color: var(--primary-dark); margin-bottom: 8px; }
.mini-card p { font-size: 0.92rem; color: var(--text-soft); }

/* ================= PARAMS ================= */
.params-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 20px;
}
.param-card {
  background: #fff;
  border-radius: var(--radius-sm);
  border-top: 4px solid var(--primary);
  box-shadow: var(--shadow);
  padding: 26px 24px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.param-card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(143, 126, 214, 0.07), rgba(78, 205, 196, 0.07));
  opacity: 0;
  transition: var(--transition);
}
.param-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-hover); }
.param-card:hover::before { opacity: 1; }
.param-card:nth-child(3n+2) { border-top-color: var(--secondary); }
.param-card:nth-child(3n+3) { border-top-color: var(--accent); }

.param-value {
  position: relative;
  display: block;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 1.85rem;
  line-height: 1.15;
  color: var(--primary-deep);
  margin-bottom: 12px;
  letter-spacing: -0.01em;
}
.param-value small { font-size: 0.52em; font-weight: 700; color: var(--primary); }
.param-card h3 { position: relative; font-size: 1rem; color: var(--text); margin-bottom: 8px; }
.param-card p { position: relative; font-size: 0.86rem; color: var(--text-soft); line-height: 1.6; }

.table-wrap {
  margin-top: 34px;
  overflow-x: auto;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  background: #fff;
}
.spec-table { width: 100%; border-collapse: collapse; min-width: 560px; table-layout: fixed; }
.spec-table caption {
  text-align: left;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  color: var(--primary-dark);
  padding: 20px 22px 12px;
  font-size: 1rem;
}
.spec-table { background: #fff; }
.spec-table th, .spec-table td { padding: 12px 22px; text-align: left; font-size: 0.9rem; color: #333333 !important; background: #fff !important; }
.spec-table th:nth-child(1), .spec-table td:nth-child(1) { width: 26%; }
.spec-table th:nth-child(2), .spec-table td:nth-child(2) { width: 38%; }
.spec-table th:nth-child(3), .spec-table td:nth-child(3) { width: 12%; }
.spec-table th:nth-child(4), .spec-table td:nth-child(4) { width: 24%; }
.spec-table thead th {
  background: linear-gradient(to right, rgba(143, 126, 214, 0.16), rgba(78, 205, 196, 0.12)) !important;
  color: #5a49a8 !important;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.spec-table tbody tr { border-top: 1px solid var(--line); }
.spec-table tbody tr:hover { background: rgba(143, 126, 214, 0.05); }
.spec-table td:first-child { font-weight: 600; color: var(--text); }

/* ================= FEATURE CARDS ================= */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}
.feature-card {
  background: #fff;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  border-top: 4px solid var(--primary);
  padding: 30px 28px;
  position: relative;
  overflow: hidden;
  transition: var(--transition);
}
.feature-card::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(143, 126, 214, 0.06), rgba(78, 205, 196, 0.06));
  opacity: 0;
  transition: var(--transition);
}
.feature-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-hover); }
.feature-card:hover::before { opacity: 1; }
.feature-card:nth-child(even) { border-top-color: var(--accent); }

.feature-ico {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 54px; height: 54px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(143, 126, 214, 0.16), rgba(78, 205, 196, 0.16));
  color: var(--primary-dark);
  margin-bottom: 18px;
  transition: var(--transition);
}
.feature-ico svg { width: 26px; height: 26px; }
.feature-card:hover .feature-ico { transform: scale(1.08) rotate(-4deg); color: var(--secondary); }
.feature-card h3 { position: relative; font-size: 1.12rem; color: var(--primary-dark); margin-bottom: 10px; }
.feature-card p { position: relative; font-size: 0.92rem; color: var(--text-soft); line-height: 1.7; }

.callout {
  margin-top: 26px;
  border-radius: var(--radius-sm);
  padding: 26px 30px;
  background: linear-gradient(120deg, rgba(255, 107, 107, 0.10), rgba(143, 126, 214, 0.10));
  border: 1px dashed rgba(255, 107, 107, 0.45);
}
.callout h3 { font-size: 1.05rem; color: var(--secondary); margin-bottom: 10px; }
.callout p { font-size: 0.95rem; color: var(--text); }

/* ================= VERIFICATION ================= */
.verify-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  margin-bottom: 26px;
}
.verify-item {
  background: linear-gradient(to right, #f2f0ff, #e9e6f8);
  border-left: 5px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 24px 22px;
  box-shadow: var(--shadow);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.verify-item:nth-child(2) { border-left-color: var(--primary); }
.verify-item:nth-child(3) { border-left-color: var(--secondary); }
.verify-item:nth-child(4) { border-left-color: var(--gold); }
.verify-item:hover { transform: translateX(8px); box-shadow: var(--shadow-hover); }
.verify-num {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 1.75rem;
  color: var(--primary-deep);
  line-height: 1.1;
  margin-bottom: 10px;
}
.verify-body h3 { font-size: 0.98rem; color: var(--text); margin-bottom: 6px; }
.verify-body p { font-size: 0.84rem; color: var(--text-soft); line-height: 1.6; }

.open-list {
  background: #fff;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 30px 32px;
  border-top: 4px solid var(--secondary);
}
.open-list h3 { color: var(--primary-dark); font-size: 1.1rem; margin-bottom: 6px; }
.open-note { font-size: 0.86rem; color: var(--text-soft); margin-bottom: 18px; }
.open-list ul { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 26px; }
.open-list li {
  position: relative;
  padding-left: 22px;
  font-size: 0.9rem;
  color: var(--text);
}
.open-list li::before {
  content: '';
  position: absolute;
  left: 0; top: 8px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--secondary);
  box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.16);
}

/* ================= GALLERY ================= */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}
.gallery-item {
  position: relative;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #fbfaff;
  overflow: hidden;
  cursor: zoom-in;
  box-shadow: var(--shadow);
  transition: var(--transition);
  font: inherit;
}
.gallery-item img {
  width: 100%;
  height: 250px;
  object-fit: contain;
  background: #fff;
  padding: 10px;
  transition: transform 0.45s ease;
}
.gallery-item:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); border-color: var(--primary-light); }
.gallery-item:hover img { transform: scale(1.03); }
.gallery-caption {
  display: block;
  padding: 12px 16px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 0.86rem;
  color: var(--primary-dark);
  background: linear-gradient(to right, rgba(143, 126, 214, 0.10), rgba(78, 205, 196, 0.08));
  border-top: 1px solid var(--line);
  text-align: left;
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  background: rgba(38, 27, 74, 0.92);
  backdrop-filter: blur(8px);
}
.lightbox.open { display: flex; animation: fadeIn 0.25s ease; }
.lightbox figure {
  max-width: min(1100px, 96vw);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.lightbox img {
  max-height: 78vh;
  width: auto;
  margin: 0 auto;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
}
.lightbox figcaption {
  text-align: center;
  color: rgba(255, 255, 255, 0.92);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.95rem;
}
.lightbox-close {
  position: absolute;
  top: 18px; right: 22px;
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.35);
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  font-size: 1.6rem;
  line-height: 1;
  cursor: pointer;
  transition: var(--transition);
}
.lightbox-close:hover { background: rgba(255, 255, 255, 0.28); transform: rotate(90deg); }

/* ================= EDITION ================= */
.edition-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 36px;
  align-items: start;
}
.edition-main p { font-size: 1rem; color: var(--text); line-height: 1.75; margin-bottom: 24px; }
.edition-facts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 26px;
}
.edition-facts div {
  background: linear-gradient(160deg, rgba(143, 126, 214, 0.12), rgba(78, 205, 196, 0.10));
  border-radius: 14px;
  padding: 16px 12px;
  text-align: center;
}
.edition-facts strong {
  display: block;
  font-family: 'Montserrat', sans-serif;
  font-size: 1.5rem;
  color: var(--primary-deep);
}
.edition-facts span { font-size: 0.76rem; color: var(--text-soft); }

.edition-list { list-style: none; display: grid; gap: 12px; }
.edition-list li {
  background: #fff;
  border-radius: 0 14px 14px 0;
  border-left: 4px solid var(--accent);
  box-shadow: var(--shadow);
  padding: 16px 18px;
  font-size: 0.9rem;
  color: var(--text);
  transition: var(--transition);
}
.edition-list li:hover { transform: translateX(6px); box-shadow: var(--shadow-hover); }
.edition-list span {
  display: inline-block;
  min-width: 62px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  color: var(--primary-dark);
}

/* ================= AUTHORS ================= */
.team-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
  margin-bottom: 24px;
}
.team-card {
  background: #fff;
  border-radius: var(--radius-sm);
  border-top: 4px solid var(--primary);
  box-shadow: var(--shadow);
  padding: 30px 28px;
  text-align: center;
  transition: var(--transition);
}
.team-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
.team-card:nth-child(2) { border-top-color: var(--accent); }
.team-avatar {
  width: 78px; height: 78px;
  margin: 0 auto 16px;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 10px 22px rgba(90, 73, 168, 0.28);
}
.team-avatar-alt { background: linear-gradient(135deg, var(--accent), #2f9e97); font-size: 1rem; }
.team-card h3 { font-size: 1.1rem; color: var(--primary-dark); margin-bottom: 4px; }
.team-role {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--secondary);
  font-weight: 700;
  margin-bottom: 14px;
}
.team-card p:last-child { font-size: 0.9rem; color: var(--text-soft); line-height: 1.7; }

.license-note {
  background: linear-gradient(to right, rgba(143, 126, 214, 0.07), rgba(78, 205, 196, 0.07));
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 24px 28px;
}
.license-note h3 { font-size: 1rem; color: var(--primary-dark); margin-bottom: 8px; }
.license-note p { font-size: 0.88rem; color: var(--text-soft); line-height: 1.7; }

/* ================= FOOTER ================= */
.footer { max-width: var(--maxw); margin: 0 auto; width: 100%; padding: 26px 0 8px; }
.footer-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  border-top: 1px solid rgba(255, 255, 255, 0.24);
  padding-top: 22px;
}
.footer-title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: #fff;
}
.footer-sub, .footer-copy { font-size: 0.82rem; color: rgba(255, 255, 255, 0.78); }

/* ================= ANIMATIONS ================= */
.fade-in { opacity: 1; transform: none; transition: opacity 0.7s ease, transform 0.7s ease; }
.fade-in.visible { opacity: 1; transform: none; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes drift {
  from { transform: translate3d(0, 0, 0) rotate(0deg); }
  to { transform: translate3d(-120px, -90px, 0) rotate(2deg); }
}
@keyframes floaty {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* ================= RESPONSIVE ================= */
@media (max-width: 1100px) {
  .params-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .verify-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .container { padding: 0 38px; }
}

@media (max-width: 900px) {
  .about-grid, .edition-grid { grid-template-columns: 1fr; }
  .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .open-list ul { grid-template-columns: 1fr; }
  .nav-toggle { display: grid; }
  .nav { border-radius: 22px; flex-wrap: wrap; }
  .nav-links {
    display: none;
    width: 100%;
    margin: 6px 0 4px;
    padding: 8px 4px 4px;
    border-top: 1px solid rgba(255, 255, 255, 0.25);
    gap: 2px;
  }
  .nav-links.open { display: flex; }
  .nav-links a { font-size: 0.9rem; }
}

@media (max-width: 768px) {
  body { padding: 14px; }
  .container { padding: 0 24px; }
  .hero { padding: 56px 0 44px; }
  .hero-actions .btn { padding: 12px 22px; font-size: 0.88rem; }
  .card-section { padding: 54px 0; }
  .section-title { margin-bottom: 36px; }
  .params-grid, .cards-grid, .team-grid, .gallery-grid { grid-template-columns: 1fr; }
  .verify-grid { grid-template-columns: 1fr; }
  .gallery-item img { height: 210px; }
  .spec-table { min-width: 480px; }
  .footer-inner { flex-direction: column; align-items: flex-start; }
}

@media (max-width: 560px) {
  body { padding: 10px; }
  .container { padding: 0 16px; }
  .eyebrow { font-size: 0.66rem; letter-spacing: 0.1em; padding: 7px 13px; }
  .emblem { width: 126px; }
  .hero-lead { font-size: 0.95rem; }
  .hero-stats { padding: 16px 6px; }
  .hero-stat dd { font-size: 1.02rem; }
  .hero-stat dt { font-size: 0.64rem; }
  .card-section { padding: 40px 0; border-radius: 16px; }
  .param-value { font-size: 1.55rem; }
  .feature-card, .param-card, .team-card { padding: 22px 20px; }
  .open-list { padding: 22px 20px; }
  .gallery-item img { height: 170px; }
  .edition-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lightbox { padding: 20px 12px; }
  .lightbox-close { top: 10px; right: 12px; }
}

/* ================= ACCESSIBILITY ================= */
:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .fade-in { opacity: 1; transform: none; }
}

@media print {
  body { background: #fff; padding: 0; color: #000; }
  .nav-wrap, .hero-actions, .lightbox, .footer { display: none; }
  .card-section, .hero { box-shadow: none; break-inside: avoid; }
  .fade-in { opacity: 1; transform: none; }
}

/* ================= ВНУТРЕННИЕ СТРАНИЦЫ ================= */
.page-head {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid rgba(255, 255, 255, 0.28);
  background:
    linear-gradient(150deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.06) 45%, rgba(78, 205, 196, 0.10) 100%),
    rgba(131, 125, 189, 0.55);
  backdrop-filter: blur(16px);

}

/* Переход между страницами — в версии для хостинга */
.pager {
  max-width: var(--maxw);

  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.pager a {

}
.pager .pager-name { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1rem; }
.pager .pager-next { text-align: right; }

/* Во фрейме Google Sites высота окна ограничена: первый экран сжимается */

<script>
/* ММОСО’Н — поведение страницы.
   Без зависимостей: появление при скролле, счётчики, меню, лайтбокс. */
(function () {
  'use strict';

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 1. Появление элементов ---------- */
  const fadeEls = document.querySelectorAll('.fade-in');

  /* Элементы уже видимы по умолчанию (CSS: opacity: 1).
     JS добавляет плавное появление при скролле как улучшение. */
  function showAll() {
    fadeEls.forEach((el) => el.classList.add('visible'));
  }

  if (reduceMotion || !('IntersectionObserver' in window)) {
    showAll();
  } else {
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const el = entry.target;
          const siblings = Array.from(el.parentElement.children).filter((n) =>
            n.classList.contains('fade-in')
          );
          const index = Math.max(0, siblings.indexOf(el));
          el.style.transitionDelay = Math.min(index * 60, 300) + 'ms';
          el.classList.add('visible');
          io.unobserve(el);
        });
      },
      { threshold: 0.12, rootMargin: '0px 0px -60px 0px' }
    );
    fadeEls.forEach((el) => io.observe(el));
    /* Страховка: если наблюдатель почему-то не сработал, контент не должен остаться невидимым */
    window.setTimeout(() => {
      fadeEls.forEach((el) => {
        if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add('visible');
      });
    }, 1200);
  }

  /* ---------- 2. Счётчики в карточках параметров ---------- */
  const counters = document.querySelectorAll('[data-count]');

  function formatNumber(value) {
    return value.toLocaleString('ru-RU').replace(/\u00A0/g, ' ');
  }

  function animateCounter(el) {
    const target = parseFloat(el.dataset.count);
    const suffix = el.dataset.suffix || '';
    if (!isFinite(target)) return;

    if (reduceMotion) {
      el.textContent = formatNumber(target) + suffix;
      return;
    }

    const duration = 1200;
    const start = performance.now();

    function frame(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(target * eased);
      el.textContent = formatNumber(current) + suffix;
      if (progress < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  if (counters.length) {
    if (!('IntersectionObserver' in window) || reduceMotion) {
      counters.forEach((c) => {
        c.textContent = formatNumber(parseFloat(c.dataset.count)) + (c.dataset.suffix || '');
      });
    } else {
      const counterObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            animateCounter(entry.target);
            counterObserver.unobserve(entry.target);
          });
        },
        { threshold: 0.5 }
      );
      counters.forEach((c) => counterObserver.observe(c));
    }
  }

  /* ---------- 3. Мобильное меню ---------- */
  const navToggle = document.querySelector('.nav-toggle');
  const navLinks = document.getElementById('nav-links');

  if (navToggle && navLinks) {
    navToggle.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(open));
    });
    navLinks.addEventListener('click', (e) => {
      if (e.target.closest('a')) {
        navLinks.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
      }
    });
  }

  /* ---------- 4. Подсветка активного пункта меню ---------- */
  const sections = Array.from(document.querySelectorAll('main section[id]'));
  const linkMap = new Map();
  document.querySelectorAll('.nav-links a').forEach((a) => {
    const id = a.getAttribute('href').replace('#', '');
    linkMap.set(id, a);
  });

  if ('IntersectionObserver' in window && sections.length) {
    const navObserver = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          const link = linkMap.get(entry.target.id);
          if (!link) return;
          if (entry.isIntersecting) {
            document.querySelectorAll('.nav-links a.active').forEach((a) => a.classList.remove('active'));
            link.classList.add('active');
          }
        });
      },
      { rootMargin: '-45% 0px -45% 0px', threshold: 0 }
    );
    sections.forEach((s) => navObserver.observe(s));
  }

  /* ---------- 5. Лайтбокс для иллюстраций ---------- */
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxCaption = document.getElementById('lightbox-caption');
  const lightboxClose = lightbox ? lightbox.querySelector('.lightbox-close') : null;
  let lastFocused = null;

  function openLightbox(item) {
    /* В сборке без отдельного файла data-full может не быть: тогда
       полноразмерной служит сама картинка карточки — она уже внутри файла. */
    const inner = item.querySelector('img');
    const full = item.dataset.full || (inner ? inner.src : '');
    const title = item.dataset.title || (inner ? inner.alt : '');
    if (!lightbox || !full) return;
    lastFocused = item;
    lightboxImg.src = full;
    lightboxImg.alt = title;
    lightboxCaption.textContent = title;
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    if (lightboxClose) lightboxClose.focus();
  }

  function closeLightbox() {
    if (!lightbox) return;
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    lightboxImg.src = '';
    document.body.style.overflow = '';
    if (lastFocused) lastFocused.focus();
  }

  document.querySelectorAll('.gallery-item').forEach((item) => {
    item.addEventListener('click', () => openLightbox(item));
  });

  if (lightbox) {
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target === lightboxClose) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
    });
  }

  /* ---------- 7. Ссылки между страницами ----------
     В файлах каталога embed/ ссылки заданы как href="#" с атрибутом data-page.
     Навигацию даёт меню Google Sites. */
  const pageMap = window.MMOSON_LINKS || {};
  document.querySelectorAll('a[data-page]').forEach((a) => {
    const key = a.dataset.page;
    if (!pageMap[key]) return;
    a.href = pageMap[key];
    a.target = '_top';
    a.rel = 'noopener';
  });

  /* ---------- 6. Плавная прокрутка с поправкой на липкую навигацию ---------- */
  document.querySelectorAll('a[href^="#"]').forEach((a) => {
    a.addEventListener('click', (e) => {
      const id = a.getAttribute('href');
      if (!id || id === '#') return;
      const target = document.querySelector(id);
      if (!target) return;
      e.preventDefault();
      const offset = window.innerWidth > 900 ? 84 : 110;
      const top = target.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top, behavior: reduceMotion ? 'auto' : 'smooth' });
      history.replaceState(null, '', id);
    });
  });
})();

</script>
</body>
</html>
